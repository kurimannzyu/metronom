<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef0f3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Blue Tempo</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"></head><body><main><div class="pendulum"><div class="arc" aria-hidden="true"></div><div id="arm"><button id="weight" role="slider" aria-label="重りを上下に動かしてテンポを変更" aria-valuemin="30" aria-valuemax="300" aria-valuenow="105" aria-orientation="vertical"><span></span></button></div><div class="pivot" aria-hidden="true"></div></div><section class="tempo"><div id="mark">Moderato</div><div class="tempo-row"><button id="minus" class="round" aria-label="BPMを1下げる">−</button><label><input id="bpm" type="text" inputmode="numeric" value="105" aria-label="BPM 30から300"><small>BPM</small></label><button id="plus" class="round" aria-label="BPMを1上げる">＋</button></div></section><div id="beats" aria-label="拍の表示"></div><div class="controls"><div class="meter-label"><span>拍子</span><button id="meter" aria-label="拍子を選択" aria-haspopup="dialog" aria-controls="meter-dialog">4/4</button></div><button id="mute" aria-pressed="false">音 ON</button></div><details class="sound-settings"><summary aria-label="音とリズムの設定" title="音とリズムの設定"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-.5 2-2 1.2-2-.6-2 3.4L4 10.4v2.3L2.5 14l2 3.4 2-.6 2 1.2.5 2h4l.5-2 2-1.2 2 .6 2-3.4-1.5-1.3v-2.3l1.5-1.4-2-3.4-2 .6-2-1.2-.5-2Z"/><circle cx="11" cy="11.5" r="3"/></svg></summary><div class="settings"><label>1拍目のアクセント<span class="accent-control"><span id="accent-state" aria-hidden="true">ON</span><input id="accent" type="checkbox" role="switch" checked></span></label><label>クリックの細分化<select id="division"><option value="1">分割なし</option><option value="2">2分割</option><option value="3">3分割</option><option value="4">4分割</option></select></label><label>音量 <input id="volume" type="range" min="0" max="100" value="70"></label><p>分母が8の拍子は8分音符1つを1拍として数えます。BPMはその拍の速さです。</p></div></details><button id="start">START</button><p id="status" role="status"></p></main><dialog id="meter-dialog" aria-labelledby="meter-title"><div class="meter-heading"><h2 id="meter-title">拍子を選択</h2><button id="meter-close" aria-label="拍子の一覧を閉じる">×</button></div><div id="meter-grid" class="meter-grid" aria-label="拍子一覧"></div></dialog><script type="module" src="./app.js"></script></body></html>
